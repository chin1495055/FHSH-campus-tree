<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>票選圖卡</title>
<!-- 票選宣傳圖卡。網址加 ?c=卡片編號 只顯示一張（給 render.sh 截圖用）；不加就列出全部，方便檢查。 -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@700;900&display=swap">
<link rel="stylesheet" href="../../../design-system/tokens.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--ink-300); font-family: 'Noto Sans TC', sans-serif; color: var(--text); }
  body.gallery { padding: 24px; display: flex; flex-wrap: wrap; gap: 24px; }
  body.gallery .vc { zoom: 0.3; }
  body.single { background: var(--surface); }

  /* 卡片外框：墨色粗框＋窗花格紋底，和 App 的分享卡一樣 */
  .vc { position: relative; width: 1080px; height: 1350px; overflow: hidden; background: var(--ink-900); padding: 14px; flex: none; }
  .vc.story { height: 1920px; }
  .vc.og { width: 1200px; height: 630px; }
  .og .vc__in { flex-direction: row; align-items: center; padding: 56px 80px 56px 130px; gap: 20px; }
  .vc__in { position: relative; width: 100%; height: 100%; background: var(--surface) url(../../../design-system/assets/patterns/lattice.svg) 0 0 / 56px; display: flex; flex-direction: column; padding: 64px 72px 52px; }
  .vc__in.plain { background: var(--surface); }
  /* 底圖選項：網址加 &bg=名稱（深綠的卡不受影響） */
  [data-bg="paper"] .vc__in:not(.dark) { background: var(--surface); }
  [data-bg="faint"] .vc__in:not(.dark) { background: linear-gradient(rgba(247,242,232,.82), rgba(247,242,232,.82)), var(--surface) url(../../../design-system/assets/patterns/lattice.svg) 0 0 / 56px; }
  [data-bg="edge"] .vc__in:not(.dark) { background: var(--surface) url(../../../design-system/assets/patterns/lattice.svg) 0 0 / 56px; }
  [data-bg="edge"] .vc__in:not(.dark)::before { content: ''; position: absolute; inset: 36px; background: var(--surface); border: 4px solid var(--outline); border-radius: 10px; }
  [data-bg="edge"] .vc__in:not(.dark) > * { position: relative; }
  [data-bg="edge"] .vc__in:not(.dark) { padding-bottom: 72px; }
  [data-bg="green"] .vc__in:not(.dark) { background: var(--green-50); }
  [data-bg="raised"] .vc__in:not(.dark) { background: var(--surface-raised); }
  .vc__in.dark { background: linear-gradient(rgba(32,63,42,.88), rgba(32,63,42,.88)), var(--brand-strong) url(../../../design-system/assets/patterns/cloud.svg) center / 320px; color: var(--ink-50); }

  .vc__head { display: flex; align-items: center; justify-content: space-between; }
  .vc__logo { height: 76px; }
  .vc__page { font: 700 30px/1 'Noto Sans TC'; color: var(--text-muted); background: var(--surface-raised); border: 3px solid var(--outline); border-radius: 999px; padding: 10px 22px; }
  .vc__body { flex: 1; display: flex; flex-direction: column; justify-content: center; position: relative; padding: 32px 0; }
  .vc__foot { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; font: 500 24px/1.4 'Noto Sans TC'; color: var(--text-muted); }
  .vc__team { font: 900 28px/1 'Noto Serif TC'; color: var(--text); white-space: nowrap; }
  .dark .vc__foot { color: var(--ink-200); }
  .dark .vc__page { color: var(--ink-100); background: transparent; border-color: var(--ink-200); }
  .dark .vc__team { color: var(--honor-on-dark); }

  /* 文字 */
  .h1 { font: 900 90px/1.2 'Noto Serif TC'; letter-spacing: 2px; }
  .h2 { font: 900 80px/1.25 'Noto Serif TC'; }
  .h3 { font: 900 56px/1.3 'Noto Serif TC'; }
  .lead { font: 500 40px/1.6 'Noto Sans TC'; }
  .p { font: 400 34px/1.7 'Noto Sans TC'; }
  .muted { color: var(--text-muted); }
  .green { color: var(--brand-text); }
  .dark .green { color: var(--green-200); }
  .gold { color: var(--honor-on-dark); }

  /* 元件 */
  .panel { background: var(--surface-raised); border: 6px solid var(--outline); border-radius: 14px; padding: 40px 44px; }
  .plaque { display: inline-block; background: var(--brand-strong); color: var(--honor-on-dark); border: 6px solid var(--outline); outline: 3px solid var(--honor-on-dark); outline-offset: -14px; border-radius: 6px; padding: 22px 40px; font: 900 44px/1.3 'Noto Serif TC'; }
  .btn { display: inline-flex; align-items: center; justify-content: center; background: var(--action); color: var(--on-action); border: 6px solid var(--outline); outline: 3px solid var(--ink-50); outline-offset: -12px; border-radius: 8px; padding: 26px 48px; font: 900 46px/1 'Noto Sans TC'; }
  .tag { display: inline-block; font: 700 30px/1 'Noto Sans TC'; border: 3px solid var(--outline); border-radius: 6px; padding: 12px 18px; background: var(--state-ok-bg); color: var(--state-ok-text); }
  .qr { background: #fff; border: 5px solid var(--outline); border-radius: 10px; padding: 14px; }
  .qr img, .qr canvas { display: block; }
  /* 燕尾屋脊（照 design-system Ridge）：左右燕尾＋中間伸縮的梁，右端鏡像；顏色跟著 color。
     燕尾用內嵌 SVG，不用 mask，因為 file:// 截圖時遮罩圖會被擋 */
  .ridge { display: flex; align-items: flex-end; height: 36px; color: var(--outline); }
  .ridge svg { width: 48px; height: 36px; flex: none; display: block; }
  .ridge svg:last-child { transform: scaleX(-1); }
  .ridge__beam { flex: 1; height: 6px; margin-bottom: 0; background: currentColor; }
  .dark .ridge { color: var(--ink-50); }
  .beast { display: block; object-fit: contain; }
  .note { font: 400 22px/1.5 'Noto Sans TC'; color: var(--text-muted); }
  .dark .note { color: var(--ink-300); }

  /* C1 主視覺 */
  .c1-beasts { display: flex; justify-content: center; align-items: flex-end; gap: 0; margin: 10px 0 0; }
  .c1-beasts img:nth-child(2) { height: 290px; margin: 0 -30px; position: relative; z-index: 1; }
  .c1-beasts img:nth-child(1), .c1-beasts img:nth-child(3) { height: 215px; }
  .c1-ground { height: 10px; background: var(--outline); border-radius: 5px; margin: -6px 40px 0; }
  .c1-vote { display: flex; align-items: center; justify-content: space-between; gap: 32px; margin-top: 36px; }

  /* 輪播的大數字 */
  .bignum { font: 900 230px/1 'Noto Serif TC'; color: var(--brand-strong); letter-spacing: -4px; }
  .bignum small { font-size: 80px; letter-spacing: 0; margin-left: 12px; }
  .city { border-left: 12px solid var(--state-keep); background: var(--state-keep-bg); padding: 30px 36px; border-radius: 0 12px 12px 0; }
  .city b { color: var(--state-keep); font: 900 32px/1 'Noto Sans TC'; display: block; margin-bottom: 14px; }
  .case { display: grid; grid-template-columns: 120px 1fr; gap: 28px; align-items: start; }
  .case + .case { margin-top: 40px; }
  .case__icon { width: 120px; height: 120px; border: 5px solid var(--outline); border-radius: 12px; background: var(--state-notice-bg); display: grid; place-items: center; }
  .case__icon img { width: 80px; }
  .case h4 { font: 900 44px/1.3 'Noto Serif TC'; margin-bottom: 8px; }

  /* 步驟 */
  .stepnum { display: inline-grid; place-items: center; width: 150px; height: 150px; border-radius: 50%; background: var(--brand-strong); color: var(--honor-on-dark); border: 6px solid var(--outline); font: 900 84px/1 'Noto Serif TC'; }
  .stepicon { width: 230px; height: 230px; }
  .shot { border: 6px solid var(--outline); border-radius: 14px; display: block; }
  /* 實機截圖：墨框手機，只露出上半部 */
  .phone { width: 400px; height: 630px; margin: 0 auto; border: 8px solid var(--outline); border-radius: 44px; overflow: hidden; background: var(--surface-raised); outline: 3px solid var(--outline); outline-offset: 6px; flex: none; }
  .phone img { width: 100%; display: block; }
  .phones { display: flex; justify-content: center; gap: 24px; margin-top: 44px; }
  .phones .phone { width: 276px; height: 540px; border-width: 6px; border-radius: 32px; outline: none; }
  .phones p { text-align: center; font: 900 32px/1.3 'Noto Serif TC'; margin-top: 18px; }

  /* 神獸卡 */
  .bc { display: grid; grid-template-columns: 430px 1fr; gap: 44px; align-items: center; }
  .bc__img { background: var(--surface-raised); border: 6px solid var(--outline); border-radius: 14px; height: 500px; display: grid; place-items: end center; overflow: hidden; position: relative; }
  .bc__img::before { content: ''; position: absolute; width: 360px; height: 360px; border-radius: 50%; background: var(--gold-100); border: 5px solid var(--outline); top: 40px; }
  .bc__img img { position: relative; height: 470px; }
  .bc__name { font: 900 120px/1.1 'Noto Serif TC'; }
  .bc__meta { font: 700 34px/1.5 'Noto Sans TC'; color: var(--brand-text); margin: 10px 0 22px; }
  .say { position: relative; background: var(--surface-raised); border: 5px solid var(--outline); border-radius: 14px; padding: 26px 32px; font: 900 42px/1.45 'Noto Serif TC'; }
  .fact { margin-top: 28px; padding: 30px 40px; }
  .fact b { font: 900 32px/1 'Noto Sans TC'; color: var(--honor-text); display: block; margin-bottom: 12px; }

  /* 褐根病 */
  .signs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 26px; margin-top: 44px; }
  .sign { background: var(--surface-raised); border: 5px solid var(--outline); border-radius: 14px; padding: 22px 20px 28px; text-align: center; }
  .sign svg { width: 100%; height: auto; display: block; margin-bottom: 18px; }
  .sign h4 { font: 900 40px/1.3 'Noto Serif TC'; }
  .sign p { font: 400 26px/1.55 'Noto Sans TC'; color: var(--text-muted); margin-top: 10px; }
  .warn { margin-top: 40px; background: var(--state-watch-bg); border: 5px solid var(--outline); border-radius: 14px; padding: 28px 34px; font: 500 32px/1.6 'Noto Sans TC'; color: var(--text); }
  .warn b { font-weight: 900; }

  /* 限動倒數 */
  .story .vc__in { padding: 260px 80px 360px; text-align: center; }
  .story .vc__head { justify-content: center; }
  .story .vc__foot { justify-content: center; }
  .count { font: 900 300px/1 'Noto Serif TC'; color: var(--honor-on-dark); }
  .count small { font-size: 120px; }

  /* C8 社區凝聚力（概念）*/
  .concept { display: inline-block; font: 700 26px/1 'Noto Sans TC'; color: var(--honor-text); background: var(--gold-50); border: 3px solid var(--outline); border-radius: 999px; padding: 10px 20px; }
  .c8-scene { display: block; width: 100%; height: auto; }
  .bubbles { display: flex; flex-direction: column; gap: 22px; margin-top: 44px; }
  .bub { max-width: 78%; background: var(--surface-raised); border: 5px solid var(--outline); border-radius: 22px; padding: 22px 30px; text-align: left; font: 500 34px/1.5 'Noto Sans TC'; }
  .bub small { display: block; font: 700 24px/1 'Noto Sans TC'; color: var(--text-muted); margin-bottom: 10px; }
  .bub.r { align-self: flex-end; background: var(--green-50); }
  .evs { display: grid; gap: 22px; margin-top: 44px; }
  .ev { display: grid; grid-template-columns: 120px 1fr; gap: 26px; align-items: center; text-align: left; border: 5px solid var(--outline); border-radius: 14px; padding: 20px 26px; outline: 3px dashed var(--green-400); outline-offset: -14px; }
  .ev:nth-child(1) { background: var(--green-200); } .ev:nth-child(2) { background: var(--green-100); } .ev:nth-child(3) { background: var(--green-50); }
  .ev__date { background: var(--surface-raised); border: 4px solid var(--outline); border-radius: 8px; text-align: center; padding: 10px 0; font: 900 24px/1.2 'Noto Sans TC'; }
  .ev__date b { display: block; font: 900 46px/1.1 'Noto Serif TC'; }
  .ev h4 { font: 900 42px/1.3 'Noto Serif TC'; }
  .ev p { font: 400 28px/1.5 'Noto Sans TC'; color: var(--text-muted); margin-top: 4px; }
  .lights { display: grid; grid-template-columns: repeat(10, 1fr); gap: 14px; margin: 40px auto 0; width: 820px; }
  .lights i { aspect-ratio: 1; border-radius: 50%; border: 4px solid var(--outline); background: var(--ink-200); }
  .lights i.on { background: var(--honor); box-shadow: 0 0 0 6px var(--gold-100); }
</style>
</head>
<body>
<div id="root"></div>
<script>
const DS = '../../../design-system/assets/';
const LOGO = DS + 'logos/logo-horizontal.svg';
const LOGO_REV = DS + 'logos/logo-horizontal-reverse.svg';
const B = (slug, mood = 'healthy') => `${DS}character/beasts/${slug}/${mood}-cutout.png`;
const ICON = (n) => `${DS}icons/${n}.svg`;
const SHOT = (n) => `../screenshots/${n}.png`;
// 燕尾一端，和 design-system/assets/patterns/ridge-end.svg 同一個路徑，改用 currentColor
const RIDGE_END = '<svg viewBox="0 0 32 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M32 22 H14 C8 22 4 16 2 3"/><path d="M2 3 C8 12 14 16 26 18"/></svg>';
const APP = 'https://2026-debugwithpuma.tree-god.workers.dev/';
const APP_SHORT = '2026-debugwithpuma.tree-god.workers.dev';
// 投票網址（10/24 確認）。改這裡要重新輸出 C1、C2-5、C6
const VOTE_SHORT = 'puma.taipei/hackathon/works/14';
const DATA_NOTE = '樹木位置與樹種為臺北市開放資料，其餘為模擬資料';

const head = (page, rev, center) => `<div class="vc__head"${center ? ' style="justify-content:center"' : ''}><img class="vc__logo" src="${rev ? LOGO_REV : LOGO}" alt="大樹神獸">${page ? `<span class="vc__page">${page}</span>` : ''}</div>`;
const foot = (left = DATA_NOTE, center) => `<div class="vc__foot"${center ? ' style="justify-content:center;align-items:baseline;gap:28px"' : ''}><span>${left}</span><span class="vc__team">AI 方舟計畫</span></div>`;
// 這幾張用「格紋只在外框」的底圖，字比較清楚（10/24 Qmoa 選）；其他卡用網址的 bg 參數，預設格紋
const EDGE = new Set(['c8-1', 'c8-2', 'c8-3', 'c8-4', 'c8-5', 'og', 'c1', 'c2-2', 'c2-3', 'c2-5', 'c5', 'c7', 'c3-1', 'c3-2', 'c3-3', 'c3-4', 'c3-5']);
const card = (id, inner, { cls = '', inCls = '' } = {}) => ({ id, html: `<section class="vc ${cls}" data-id="${id}"${EDGE.has(id) ? ' data-bg="edge"' : ''}><div class="vc__in ${inCls}">${inner}</div></section>` });

// 褐根病三個徵兆的插圖（平塗＋墨線）
const SIGN_SVG = {
  root: `<svg viewBox="0 0 240 180"><rect width="240" height="180" fill="#EEF5EF"/><path d="M0 128 Q60 128 84 112 Q120 84 156 112 Q180 128 240 128 V180 H0Z" fill="#AD863A" stroke="#26231F" stroke-width="5"/><path d="M104 120 L104 30 Q120 20 136 30 L136 120" fill="#8C6B2E" stroke="#26231F" stroke-width="5"/><path d="M104 104 Q86 110 70 124 M136 104 Q154 110 170 124" fill="none" stroke="#26231F" stroke-width="5" stroke-linecap="round"/><path d="M84 100 l-10 -16 M156 100 l10 -16" stroke="#E2661B" stroke-width="6" stroke-linecap="round"/></svg>`,
  net: `<svg viewBox="0 0 240 180"><rect width="240" height="180" fill="#EEF5EF"/><rect x="0" y="146" width="240" height="34" fill="#AD863A" stroke="#26231F" stroke-width="5"/><path d="M76 148 L82 0 H158 L164 148Z" fill="#8C6B2E" stroke="#26231F" stroke-width="5"/><g stroke="#F1E3BF" stroke-width="4" fill="none"><path d="M84 96 L120 78 L156 96 M84 126 L120 108 L156 126 M100 88 L104 146 M138 88 L136 146 M120 78 V58"/><path d="M90 66 L120 52 L152 66"/></g><circle cx="120" cy="104" r="62" fill="none" stroke="#E2661B" stroke-width="6" stroke-dasharray="14 10"/></svg>`,
  leaf: `<svg viewBox="0 0 240 180"><rect width="240" height="180" fill="#EEF5EF"/><path d="M108 180 L112 92 H128 L132 180Z" fill="#8C6B2E" stroke="#26231F" stroke-width="5"/><path d="M120 96 L82 60 M120 96 L160 54 M120 92 V40" stroke="#26231F" stroke-width="6" stroke-linecap="round"/><g stroke="#26231F" stroke-width="4"><ellipse cx="84" cy="56" rx="20" ry="13" fill="#76AE82"/><ellipse cx="158" cy="50" rx="18" ry="12" fill="#E4CD92"/><ellipse cx="120" cy="36" rx="16" ry="11" fill="#D6B76C"/><ellipse cx="60" cy="150" rx="12" ry="7" fill="#D6B76C"/><ellipse cx="180" cy="160" rx="12" ry="7" fill="#E4CD92"/></g></svg>`,
};

const beasts = [
  { slug: 'xuxugong', name: '鬚鬚公', meta: '榕樹・約 85 歲<br>華山公園', say: '「慢慢來，樹仔是一年一年大的。」', who: '慢條斯理、愛講古，記得整條街幾十年的大小事。', fact: '榕樹的氣根垂到地面後會變粗，變成支撐的「柱子」，一棵老榕樹看起來就像一片小樹林。', n: 128 },
  { slug: 'gadang', name: '茄苳仔', meta: '茄苳・約 35 歲<br>華山公園', say: '「呷飽未？」', who: '熱心、愛照顧人，是社區的大姊頭，看到人就想招呼吃飯。', fact: '茄苳是台灣原生樹種，一片葉子由三片小葉組成，叫做三出複葉。', n: 59 },
  { slug: 'queque', name: '雀雀', meta: '雀榕・約 65 歲<br>華山公園', say: '「來來來，我介紹朋友給你認識！」', who: '熱鬧、好客、交遊廣闊，頭上總停著好幾隻小鳥。', fact: '雀榕的種子被鳥吃下後，常在別的樹或牆縫裡發芽，所以有時會在奇怪的地方看到雀榕。', n: 47 },
  { slug: 'luan', name: '欒四季', meta: '臺灣欒樹・約 10 歲<br>中央藝文公園', say: '「你看我今天這套怎麼樣？」', who: '愛打扮、愛拍照，每一季都要換新造型。', fact: '臺灣欒樹是台灣特有種，秋天開黃花、結紅褐色的果實，整條路會換上新顏色。', n: 36 },
];

const steps = [
  { shot: '01-地圖首頁', t: '打開地圖，找到樹', d: '家附近的樹都在地圖上，打開就能用。' },
  { shot: '03-守護祂', t: '按下「守護祂」', d: '住附近選在地守護，不在附近也能遠端關注。' },
  { shot: '04-回報檢查', t: '經過時回報樹況', d: '拍張照，照著清單看看樹根、樹幹、枝葉。' },
  { shot: '06-異動警報', t: '有異動，大家都知道', d: '樹被公告移除前，守護者都會收到通知。' },
  { shot: '07-求援籤', t: '分享求援籤', d: '分享到 LINE、IG、Threads，找更多人來看祂。' },
];

// C8-1 插圖「大樹下的聚會所」：平塗＋墨線，人物用下面幾個小函式畫（手腳是「墨色粗線＋上色細線」疊出來的描邊）
const INK = '#26231F';
const limb = (d, c, w = 16) => `<path d="${d}" stroke="${INK}" stroke-width="${w + 8}" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="${d}" stroke="${c}" stroke-width="${w}" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;
const hairPath = (x, y, r, type) => {
  const cap = `M${x - r - 1} ${y + 2} Q${x - r - 2} ${y - r - 8} ${x} ${y - r - 7} Q${x + r + 2} ${y - r - 8} ${x + r + 1} ${y + 2} Q${x + r * 0.7} ${y - r * 0.45} ${x + r * 0.15} ${y - r * 0.55} Q${x - r * 0.5} ${y - r * 0.4} ${x - r - 1} ${y + 2} Z`;
  if (type === 'bun') return cap + ` M${x - 4} ${y - r - 4} a12 12 0 1 1 1 0 Z`;
  if (type === 'bald') return `M${x - r - 1} ${y + 4} Q${x - r} ${y - r * 0.5} ${x - r * 0.55} ${y - r * 0.55} L${x - r * 0.6} ${y + 2} Z M${x + r + 1} ${y + 4} Q${x + r} ${y - r * 0.5} ${x + r * 0.55} ${y - r * 0.55} L${x + r * 0.6} ${y + 2} Z`;
  if (type === 'tails') return cap + ` M${x - r - 4} ${y - 6} q-16 6 -12 24 q10 -4 14 -16 Z M${x + r + 4} ${y - 6} q16 6 12 24 q-10 -4 -14 -16 Z`;
  return cap;
};
// 頭：look 是臉朝向（-1 左、0 正、1 右），glasses 給長輩
const face = (x, y, r, { skin = '#F1E3BF', hair = '#38332C', type = 'short', look = 0, glasses = false } = {}) => {
  const fx = x + look * r * 0.22, ey = y + 1;
  return `<circle cx="${x}" cy="${y}" r="${r}" fill="${skin}" stroke="${INK}" stroke-width="5"/>
    <path d="${hairPath(x, y, r, type)}" fill="${hair}" stroke="${INK}" stroke-width="5" stroke-linejoin="round"/>

      <p class="lead" style="margin-top:30px">「我們里這個月，一起守護了 <b>32</b> / 50 棵樹」</p>
      <div class="lights">${Array.from({ length: 50 }, (_, i) => `<i${i < 32 ? ' class="on"' : ''}></i>`).join('')}</div>
      <p class="p muted" style="margin-top:36px">每一次守護和回報，都在社區的燈海裡點亮一盞燈。</p>
    </div>${foot('數字為示意')}`),
  card('c8-5', `${head('5 / 5')}
    <div class="vc__body" style="text-align:center">
      <p><span class="concept">構想 ④</span></p>
      <h2 class="h2" style="margin-top:24px">長輩說故事，<br><span class="green">小孩記下來</span></h2>
      <img src="${B('xuxugong')}" alt="" style="height:420px;margin:34px auto 0">
      <p class="lead" style="margin-top:24px">老樹的來歷，由住在旁邊的人一起寫。<br>讓樹重新成為社區的中心。</p>
      <p class="p" style="margin-top:30px"><b>大樹神獸</b>｜線上票選至 10/31（六）18:00<br>${VOTE_SHORT}</p>
    </div>${foot('')}`),
];

const only = new URLSearchParams(location.search).get('c');
document.body.className = only ? 'single' : 'gallery';
document.body.dataset.bg = new URLSearchParams(location.search).get('bg') || 'lattice';
document.getElementById('root').outerHTML = CARDS.filter((c) => !only || c.id === only).map((c) => c.html).join('');
document.querySelectorAll('[data-qr]').forEach((el) => {
  const s = +el.dataset.size;
  new QRCode(el, { text: el.dataset.qr, width: s, height: s, colorDark: '#26231f', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M });
});
window.CARD_IDS = CARDS.map((c) => c.id);
</script>
