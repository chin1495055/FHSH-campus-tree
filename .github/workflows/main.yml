name: Send Discord Notification on Push

on:
  push:

jobs:
  discord-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Build commit list
        id: commits
        env:
          COMMITS_JSON: ${{ toJSON(github.event.commits) }}
        run: |
          {
            echo 'list<<__COMMITS_END__'
            echo "$COMMITS_JSON" | jq -r '.[] | "• " + (.message | split("\n")[0])'
            echo '__COMMITS_END__'
          } >> "$GITHUB_OUTPUT"

      - name: Send Discord Notification
        uses: Ilshidur/action-discord@master
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        with:
          args: |
            🚀 **New Push to Repository!**
            **Repository:** ${{ github.repository }}
            **Branch:** ${{ github.ref_name }}
            **Pusher:** ${{ github.actor }}

            **Commits in this push:**
            ${{ steps.commits.outputs.list }}

            [View Changes](https://github.com/${{ github.repository }}/compare/${{ github.event.before }}...${{ github.event.after }})
